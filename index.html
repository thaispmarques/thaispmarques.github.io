<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thais Marques — Product Design Specialist</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #f0ece4;
      font-family: Georgia, serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    video {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0.4;
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 3rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .coming-soon {
      margin-top: 1rem;
      font-size: 0.75rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      opacity: 0.45;
    }
  </style>
</head>
<body>
  <video autoplay muted loop playsinline>
    <source src="bg.mp4" type="video/mp4" />
  </video>

  <div class="content">
    <h1>Thais Marques</h1>
    <p class="coming-soon">Portfolio — Coming Soon</p>
  </div>
</body>
</html>
